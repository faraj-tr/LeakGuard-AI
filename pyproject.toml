[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-ai"
version = "0.1.0"
description = "AI-powered security gate for detecting secret leaks in vibe-coded applications."
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "rich>=13.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
leakguard = "leakguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]