[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-ai"
dynamic = ["version"]
description = "AI-powered security gate for detecting secret leaks in vibe-coded applications."
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas",
    "scikit-learn",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.50,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "httpx2>=2,<3"
]

[project.scripts]
leakguard = "leakguard.cli:app"
leakguard-api = "leakguard.runtime:run_api"
leakguard-ui = "leakguard.runtime:run_ui"
leakguard-stack = "leakguard.runtime:run_stack"

[tool.setuptools.dynamic]
version = {attr = "leakguard.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
