name: LeakGuard Security Gate

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  leakguard-security:
    name: LeakGuard Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install LeakGuard AI
        run: python -m pip install -e .

      - name: Run deterministic security scan
        run: leakguard scan . --no-ml-advisory
