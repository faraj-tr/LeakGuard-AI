name: LeakGuard Security Gate

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  leakguard-security:
    name: LeakGuard Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install LeakGuard AI
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      - name: Run LeakGuard security scan
        run: leakguard scan .
